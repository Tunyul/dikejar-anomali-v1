<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="assets/logo.svg">
    <meta name="theme-color" content="#FFCC00">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.0.0/css/flag-icons.min.css"/>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/landing.css">
    <style>
        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: -1;
        }
    </style>
</head>
<body>
    <div class="auth-overlay"></div>
    <!-- Simple Nav -->
    <nav class="landing-nav" style="position: absolute; background: transparent; border: none;">
        <div class="container nav-content">
            <a href="index.html" class="logo">ANOMALY RUSH</a>
            <div class="nav-links">
                <a href="index.html" data-i18n="nav.home">Beranda</a>
                <a href="topup.html" data-i18n="nav.topup">Top Up</a>
                <div class="language-selector">
                    <button class="lang-btn">
                        <span class="fi fi-id" id="currentLangFlag"></span> 
                        <span id="currentLangText">ID</span>
                        <i class="fa-solid fa-chevron-down"></i>
                    </button>
                    <div class="lang-dropdown">
                        <div class="lang-option" data-lang="id">
                            <span class="fi fi-id"></span> Bahasa Indonesia
                        </div>
                        <div class="lang-option" data-lang="en">
                            <span class="fi fi-us"></span> English
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    
    <div class="container auth-container">
        <div class="card auth-box">
            <div style="text-align: center; margin-bottom: 2rem;">
                <h1 style="color: var(--accent); margin-bottom: 0.5rem; font-size: 2.5rem; text-transform: uppercase; -webkit-text-stroke: 1px black; text-shadow: 2px 2px 0 #000;" data-i18n="login_title">Anomaly Rush</h1>
                <p style="color: var(--text-muted); font-family: 'Fredoka', sans-serif; font-size: 1.2rem;" data-i18n="login_subtitle">Portal Top-Up & Profil</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm">
                <div id="errorMsg" style="color: red; margin-bottom: 1rem; display: none; text-align: center; font-weight: bold; background: #ffe6e6; padding: 0.5rem; border-radius: 8px; border: 2px solid red;"></div>
                
                <div class="form-group">
                    <label for="identifier" data-i18n="login_label_id">Player ID / Email</label>
                    <input type="text" id="identifier" placeholder="Contoh: player123" required autocomplete="username" data-i18n="login_placeholder_id">
                </div>
                
                <div class="form-group">
                    <label for="password" data-i18n="login_label_pass">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;" data-i18n="login_btn">MASUK</button>
            </form>

            <div style="margin-top: 1.5rem; text-align: center;">
                <p style="font-size: 0.9rem; color: var(--text-muted);">
                    <span data-i18n="login_footer">Belum punya akun?</span> <a href="#" onclick="toggleAuthMode()" style="color: var(--secondary); text-decoration: none; font-weight: bold;" data-i18n="login_register">Daftar Petualangan Baru</a>
                </p>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/i18next@21.6.10/i18next.min.js"></script>
    <script src="https://unpkg.com/i18next-http-backend@1.3.2/i18nextHttpBackend.min.js"></script>
    <script src="https://unpkg.com/i18next-browser-languagedetector@6.1.3/i18nextBrowserLanguageDetector.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/language.js"></script>
</body>
</html>
